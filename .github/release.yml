# Categories for the release notes GitHub generates from merged pull requests.
# Pull requests are placed in the first category whose labels match.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Dependency updates
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
