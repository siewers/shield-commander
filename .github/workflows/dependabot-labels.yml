name: Dependabot labels

# Labels Dependabot pull requests that only update test packages, so they're left out of the release notes.
# Test packages are the ones in the "Tests" item group of Directory.Packages.props.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Label test-only dependency updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          [xml]$props = Get-Content Directory.Packages.props
          $testPackages = $props.Project.ItemGroup |
              Where-Object Label -eq 'Tests' |
              ForEach-Object { $_.PackageVersion.Include }

          $names = $env:DEPENDENCY_NAMES -split ',' | ForEach-Object Trim | Where-Object { $_ }
          if (-not $names) {
              Write-Output 'No dependency names reported'
              exit 0
          }

          $nonTestPackages = $names | Where-Object { $_ -notin $testPackages }
          if ($nonTestPackages) {
              Write-Output "Not test packages: $($nonTestPackages -join ', ')"
              exit 0
          }

          gh pr edit $env:PR_URL --add-label test-dependencies
