# Categories for the release notes GitHub generates from merged pull requests.
# Pull requests are placed in the first category whose labels match.
changelog:
  # Only changes to the app itself belong in the release notes
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - documentation
      - maintenance
      - dependencies
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"
